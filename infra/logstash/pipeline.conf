input {
  beats {
    port => 5044
  }
}

filter {
  json {
    source => "message"
  }

  # Подменяем @timestamp датой из самого лога
  if [timestamp] {
    date {
      match => [ "timestamp", "ISO8601" ]
      target => "@timestamp"
      remove_field => [ "timestamp" ]
    }
  }

  # Приводим числовые типы для Elasticsearch
  mutate {
    convert => {
      "duration_ms" => "float"
      "metrics_count" => "integer"
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "app-logs-ingestor-%{+YYYY.MM.dd}"
  }
}