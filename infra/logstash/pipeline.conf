input {
  beats {
    port => 5044
  }

  http {
    port => 8080
    codec => json
  }
}

filter {
  # Парсим JSON логи
  json {
    source => "message"
    target => "parsed"
  }

  # Добавляем поля из parsed в корень
  mutate {
    add_field => {
      "timestamp" => "%{[parsed][timestamp]}"
      "level" => "%{[parsed][level]}"
      "service" => "%{[parsed][service]}"
      "request_id" => "%{[parsed][request_id]}"
      "user_id" => "%{[parsed][user_id]}"
      "duration_ms" => "%{[parsed][duration_ms]}"
      "status_code" => "%{[parsed][status_code]}"
    }
  }

  # Удаляем дублирующее message поле
  mutate {
    remove_field => ["message"]
  }

  # Добавляем timestamp для Elasticsearch
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "logs-ingestor-%{+YYYY.MM.dd}"
  }
}